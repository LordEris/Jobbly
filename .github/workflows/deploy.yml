name: Deploy to IONOS

# Publie Jobbly sur jobbly.lorderis.dev : le site statique du dépôt (aucune
# construction, le fichier du dépôt est le fichier servi), adossé au projet
# Supabase commun, envoyé dans `website-jobbly/` de l'hébergement IONOS, et
# nulle part ailleurs.
#
# L'envoi est celui du workflow réutilisable commun, `sftp-deploy.yml` de
# LordEris/workflows (secrets contrôlés, dossier distant gardé, clé d'hôte
# vérifiée, destination regardée avant le --delete, envoi en trois temps,
# relectures) : une correction de ce gabarit se fait là-bas, une fois, et
# arrive ici par une montée de version (docs/versions.md là-bas). Ce fichier
# ne garde que ce qui est propre à Jobbly : le dépôt porte aussi ce qui n'est
# PAS le site (la fonction Edge dans supabase/, la documentation, les outils,
# et l'ancien script Windows tant qu'il n'est pas retiré). On n'envoie donc pas
# le dépôt : on assemble le site, par une liste FERMÉE (« Assembler le site »),
# on le vérifie, et seul ce dossier part, en artefact. Le .htaccess refuse en
# plus tout le reste, au cas où un envoi à la main l'emporterait.
#
# Déclenché à chaque push sur `main`, et à la main (Actions → « Deploy to
# IONOS » → Run workflow), avec une option « Test seulement » qui vérifie
# l'accès SFTP et la destination sans rien envoyer. La fonction jobbly-search
# ne passe pas par ici : elle se déploie à la main
# (supabase functions deploy jobbly-search).
#
# Deux tâches, qui ne font que LIRE le dépôt.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_only:
        description: "Test seulement : vérifier l'accès SFTP et la destination, sans rien envoyer"
        type: boolean
        default: false

# Le déploiement ne fait que LIRE le dépôt : il envoie ses fichiers ailleurs,
# avec les identifiants SFTP.
permissions:
  contents: read

# Deux fusions rapprochées : la seconde attend la fin de la première au lieu
# d'envoyer ses fichiers par-dessus pendant le `mirror --delete`. Elle se pose
# ici, dans l'appelant, et non dans le workflow réutilisable.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  assemble:
    name: Assembler le site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Le jeton reste hors de .git/config : rien de ce qui tourne ensuite
          # n'a à le lire.
          persist-credentials: false

      # Le site, et rien d'autre : une liste FERMÉE. Un fichier ajouté au site
      # s'ajoute ici, sinon il ne part pas — ce qui se voit à la première
      # vérification, au lieu qu'un fichier interne parte sans qu'on le sache.
      - name: Assembler le site
        run: |
          rm -rf _site && mkdir _site
          cp index.html offres.html confidentialite.html .htaccess _site/
          cp -R assets _site/assets
          echo "Site assemblé :"
          (cd _site && find . -type f | sort)

      - name: Vérifier le site assemblé
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # Ce qui ne doit jamais partir : la fonction Edge, la documentation,
          # les outils, les workflows, le Markdown, et l'ancien script Windows.
          bad=$(cd _site && find . \( -path './supabase*' -o -path './docs*' -o -path './tools*' -o -path './.github*' \
                 -o -name '*.md' -o -name '*.py' -o -name '*.ps1' -o -name '*.bat' -o -name '*.mjs' -o -name '*.ts' \
                 -o -name 'requirements.txt' -o -name 'config.exemple.json' -o -name 'LICENSE' \) -print)
          [ -z "$bad" ] || fail "fichiers internes dans le site assemblé : $bad"
          # Les fichiers dont l'absence ne se verrait qu'en production.
          for f in index.html offres.html confidentialite.html .htaccess \
                   assets/js/theme-init.js assets/js/prefs.js assets/js/presentation.js assets/js/app.js \
                   assets/js/rules.js assets/js/i18n.js assets/js/supabase.js assets/js/google-auth.js assets/js/toc-spy.js \
                   assets/css/jobbly.css assets/css/presentation.css assets/css/legal.css \
                   assets/css/lorderis-footer.css assets/css/lorderis-toggles.css assets/img/icone.svg \
                   assets/img/lorderis-logo.png; do
            [ -f "_site/$f" ] || fail "_site/$f absent"
          done
          # Chaque fichier qu'une page cite est dans le site.
          for page in index.html offres.html confidentialite.html; do
            for ref in $(grep -oE '(src|href)="/?assets/[^"?#]+' "_site/$page" | sed -E 's/^(src|href)="\/?//' | sort -u); do
              [ -f "_site/$ref" ] || fail "$page cite $ref, absent du site"
            done
          done
          # Aucun script ni style en ligne, aucun gestionnaire on…= : la CSP les
          # refuserait, et la page resterait muette.
          for page in index.html offres.html confidentialite.html; do
            if grep -Eq '<script>|<script [^>]*>[^<]|<style|style="| on[a-z]+="' "_site/$page"; then
              fail "$page porte un script, un style ou un gestionnaire en ligne, que la CSP refuse"
            fi
          done
          # Le projet Supabase du code est celui que la CSP de l'appli nomme, et
          # la clé n'est pas une clé secrète.
          url=$(grep -oE "SUPABASE_URL = '[^']+'" _site/assets/js/supabase.js | cut -d"'" -f2)
          key=$(grep -oE "SUPABASE_PUBLISHABLE_KEY = '[^']+'" _site/assets/js/supabase.js | cut -d"'" -f2)
          [ -n "$url" ] && [ -n "$key" ] || fail "URL ou clé Supabase introuvable dans assets/js/supabase.js"
          grep -q "connect-src[^;\"]*$url" _site/.htaccess || fail "$url absent de connect-src dans .htaccess"
          case "$key" in sb_secret_*|eyJ*) fail "la clé de assets/js/supabase.js n'est pas une clé publiable" ;; esac
          grep -q '^DirectoryIndex index.html$' _site/.htaccess || fail ".htaccess ne sert plus la présentation à /"
          echo "Site complet :"
          du -sh _site

      # `include-hidden-files` : sans lui, upload-artifact écarte .htaccess, et
      # le site partirait sans CSP ni repli. Le workflow d'envoi le redemande
      # (`required_files`) et échoue plutôt que de publier sans.
      - name: Déposer le site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jobbly-site
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Envoyer le site
    needs: assemble
    # PILOTE : épinglé sur le commit de la branche de LordEris/workflows qui
    # introduit sftp-deploy.yml. À remplacer, une fois cette branche fusionnée
    # et v1.0.0 étiquetée, par le SHA de l'étiquette.
    uses: LordEris/workflows/.github/workflows/sftp-deploy.yml@a7fdd6444376efb364f6d68a23595bab23c58158  # v1.0.0
    with:
      site_dir: website-jobbly
      # Anciens noms du dossier : aucun, c'est le premier site de Jobbly.
      old_site_dirs: ""
      artifact_name: jobbly-site
      required_files: index.html offres.html confidentialite.html .htaccess
      # FTP_REMOTE_DIR : « /website-jobbly » (compte qui voit tout
      # l'hébergement, le réglage posé par le propriétaire) ou « / » (compte
      # limité au dossier), rien d'autre.
      strict_remote_dir: true
      # Un compte en fait limité au dossier du site, avec /website-jobbly,
      # créerait un sous-dossier que personne ne sert (leçon de Schedules,
      # novembre 2026) : si la racine du compte ne contient aucun autre site,
      # on publie à sa racine, et la copie website-jobbly/ laissée par un envoi
      # précédent est effacée.
      detect_chrooted_account: true
      tolerate_site_copy: true
      # En trois temps, pour qu'une page chargée PENDANT l'envoi trouve ce
      # qu'elle cite : scripts, feuilles, images et .htaccess d'abord, puis les
      # pages, index.html en dernier, enfin le --delete.
      staged_upload: true
      deferred_files: offres.html confidentialite.html index.html
      verify_files: index.html offres.html .htaccess
      # Tant que le sous-domaine n'est pas pointé sur website-jobbly chez IONOS,
      # il ne répond pas, ou pas avec ce site : l'étape le DIT en avertissement,
      # sans faire échouer un envoi qui, lui, a réussi. Un site qui répond avec
      # la bonne page mais sans CSP, ou qui sert l'ancien script, échoue.
      site_url: https://jobbly.lorderis.dev
      served_pages: /=index.html
      require_csp: true
      forbidden_urls: /job_alert.py
      site_check_soft: true
      test_only: ${{ inputs.test_only == true }}
    # Un par un : `secrets: inherit` ne traverse pas les organisations.
    secrets:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_KNOWN_HOSTS: ${{ secrets.FTP_KNOWN_HOSTS }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
